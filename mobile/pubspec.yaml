name: uno_party
description: UNO GACOR - Multiplayer UNO-style card game
publish_to: 'none'
version: 1.4.0+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  socket_io_client: ^3.1.6
  shared_preferences: ^2.5.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/lobby_theme.wav
    - assets/audio/game_theme.wav
    - assets/audio/tension_theme.wav
