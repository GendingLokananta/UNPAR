name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: mobile
        run: flutter create --platforms=android --project-name=uno_party --org=id.lokananta .

      - name: Configure Android internet access and app label
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
          s = s.replace('android:label="uno_party"', 'android:label="UNO Party"')
          s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY

      - name: Resolve packages
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uno-party-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
